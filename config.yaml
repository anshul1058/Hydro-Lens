# Hydro-Lens System Configuration
app:
  title: "Hydro Lens — Microplastics Screening Backend"
  max_upload_mb: 50
  allowed_extensions: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]

model:
  # Default detector: Phase-3 5-class model (Roboflow R2+R4+R5)
  weights_path: "models/best.pt"
  input_size: 640
  conf_threshold: 0.5
  iou_threshold: 0.45
  max_det: 300
  classes: ["fragment", "fiber", "film", "foam", "pellet"]
  # Auto-route an upload to a detector by token in its filename / dataset id.
  # First matching rule wins; otherwise model.weights_path is used.
  routing:
    - match: ["d1", "d4"]
      weights_path: "models/best_v1_binary.pt"   # 100-epoch binary model (D1+D4)
    - match: ["r2", "r4", "r5", "roboflow"]
      weights_path: "models/best.pt"             # Phase-3 5-class model (Roboflow)

preprocessing:
  median_blur_kernel: 3
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]

# Capture-condition reliability gates (Addition 1)
quality:
  min_laplacian_var: 100.0   # normalized Laplacian variance; below = defocus blur
  min_luma: 40                # mean luminance; below = severe underexposure
  max_luma: 240               # above = sensor washout (glare caught by clipping gate)
  max_clipped_pct: 2.0        # % pixels <15 or >245 intensity
  min_rms_contrast: 0.08      # RMS over signal pixels (<235); below = flat field
  min_um_per_px: 0.2          # supported optical scale range (100x-400x objectives)
  max_um_per_px: 2.5
  min_ecd_um: 10.0            # documented detection range lower bound
  max_ecd_um: 5000.0          # 5 mm upper bound

calibration:
  validity_days: 7
  bead_nominal_um: [10, 50, 100]
  bead_tolerance_pct: 20
  micrometer_spacing_um: 10

confidence:
  low_threshold: 0.5
  sample_low_threshold: 0.6
  calibration_quality:
    valid: 1.0
    stale: 0.5
    missing: 0.0
  min_coverage_mm2: 1.0

sizing:
  size_bins_um: [10, 25, 50, 100, 1000, 5000]
  flag_size_um: 5000
  flag_aspect_ratio: 10
  flag_classes: ["film", "foam", "pellet"]

paths:
  calibration_file: "data/calibration/calibration.json"
  upload_dir: "data/uploads"
  reference_dir: "data/reference"
  results_dir: "data/results"

# PDF report metadata (section 1, 10, 11 of the screening report)
report:
  operator: "Hydro Lens Lab Operator"
  software_version: "HydroLens v1.0.0"
  model_version: "YOLOv8n 5-class v2.0"
  model_parameters: "3.0 M"
  hardware: "CPU (host machine)"
  training_data: "2,980 annotated particles across 5 morphological classes (fluorescence + sewage microscopy)"
  recovery_rate: null          # spike-recovery %, null = not measured
  recovery_method: "Not performed"
  false_positive_sources: "Air bubbles, dye/stain crystals, mineral grains, natural cellulose fibres, overlapping debris"
  recommended_action: "Confirm flagged particles via FTIR/Raman spectroscopy before any regulatory reporting."

# Active learning / adaptation evidence (ENR 03) - rendered only when enabled
active_learning:
  enabled: false
  budget: "20 images / cycle"
  selection_method: "Uncertainty sampling (entropy)"
  selected_indices: "[3, 17, 24, 51]"
  random_indices: "[5, 24, 38, 72]"
  condition_a_before: "mIoU 0.61"
  condition_a_after: "mIoU 0.74"
  condition_b_before: "F1 0.70"
  condition_b_after: "F1 0.83"
  active_vs_random: "+0.13 mIoU (active) vs +0.04 mIoU (random)"
  improvement: "+21.3% relative over random baseline"
  original_image_groups: 12
  partition_rule: "70/15/15 train/val/test split, grouped by source image to prevent leakage."
